name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || (gofmt -l .; exit 1)
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -race ./...
      - name: Static analysis
        run: go run honnef.co/go/tools/cmd/staticcheck@latest ./...
      - name: Vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
      - name: Build
        run: CGO_ENABLED=0 go build -trimpath -o /dev/null .

  chart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: azure/setup-helm@v5
      - name: Lint and test the chart
        run: |
          pip install --quiet pyyaml
          helm lint charts/kube-pfsense-dns-controller --strict \
            --set pfsense.url=https://pfsense.example.lan --set pfsense.existingSecret=x --set 'config.domains={example.lan}'
          ./hack/chart-test.sh

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - name: Build image (not pushed)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
