# Gateway API: the hostname comes from spec.hostnames, the IP from the status of the
# Gateway named in parentRefs (only once the Gateway has accepted the route).
# Result on pfSense:  app2.mylab.lan -> <address of istio-system/shared-gw>
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: app2
  namespace: default
spec:
  parentRefs:
    - name: shared-gw
      namespace: istio-system
  hostnames: ["app2.mylab.lan"]
  rules:
    - backendRefs:
        - name: app2
          port: 80
