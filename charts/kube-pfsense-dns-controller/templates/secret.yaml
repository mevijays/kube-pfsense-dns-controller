{{- if and (not .Values.pfsense.existingSecret) .Values.pfsense.apiKey }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "kpdc.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kpdc.labels" . | nindent 4 }}
type: Opaque
stringData:
  api-key: {{ .Values.pfsense.apiKey | quote }}
{{- end }}
